name: ci-cd

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      # `composer setup` (used for local dev onboarding) isn't used here -
      # it ends with `artisan migrate --force` against a real MySQL server,
      # which doesn't exist on this runner. Tests don't need it: Pest
      # already runs against an in-memory SQLite DB via RefreshDatabase
      # (see tests/Pest.php + phpunit.xml). We still need a real .env and
      # built assets so `php artisan` can boot and Wayfinder's generated
      # resources/js/actions|routes exist for the type checker.
      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run CI Checks
        run: composer ci:check

  deploy:
    name: Deploy to Hostinger
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # A throwaway .env just so `php artisan` can boot during the asset
      # build (the Wayfinder Vite plugin shells out to artisan to generate
      # resources/js/actions|routes). Never touches the real server .env.
      - name: Prepare throwaway .env for the asset build
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Remove build-only .env
        run: rm -f .env

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Hostinger's shared-hosting SSH endpoint load-balances across nodes
      # with different host keys, so a static known_hosts entry can mismatch
      # a connection moments after it was scanned. StrictHostKeyChecking=no
      # is a deliberate, known trade-off for this specific hosting setup -
      # see the conversation this was decided in, not a default to copy
      # elsewhere without the same caveat.
      - name: Sync files to Hostinger
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='public/storage' \
            --exclude='storage/app/public' \
            --exclude='storage/logs' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/testing' \
            ./ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Run post-deploy commands
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_SSH_PORT }}" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "bash ${{ secrets.DEPLOY_PATH }}/deploy/post-deploy.sh"
